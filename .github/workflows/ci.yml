# Gates de la auditoría (F14): check de tipos, build, audit de dependencias
# prod y links internos del dist. Sin nada instalado fuera del lockfile.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # F12: umbral alto (falla solo con vulnerabilidades high/critical en deps
      # de runtime; hoy está en 0 tras npm audit fix)
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run links
